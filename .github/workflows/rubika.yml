name: Rubika Market Report

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  rubika-report:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 jdatetime

      - name: Run Rubika report
        env:
  RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
  RUBIKA_CHANNEL_USERNAME: ${{ secrets.RUBIKA_CHANNEL_USERNAME }}
  COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
        run: |
          python rubika.py

      - name: Save Rubika price state
        run: |
          if git diff --quiet -- data/last_prices_rubika.json; then
            echo "No Rubika price state changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/last_prices_rubika.json
            git commit -m "Update Rubika price state"
            git push
          fi
